name: ServiceFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serviceflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: serviceflow
          POSTGRES_PASSWORD: serviceflow123
          POSTGRES_DB: serviceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U serviceflow -d serviceflow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_NAME: ServiceFlow
      APP_ENV: test
      APP_VERSION: 0.1.0

      POSTGRES_USER: serviceflow
      POSTGRES_PASSWORD: serviceflow123
      POSTGRES_DB: serviceflow_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

      DATABASE_URL: postgresql+asyncpg://serviceflow:serviceflow123@localhost:5432/serviceflow_test

      SECRET_KEY: serviceflow-test-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Check Python dependencies
        run: python -m pip check

      - name: Validate database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: pytest -q


  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx --no-install tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit

      - name: Audit production dependencies
        run: npm audit --omit=dev